/* ══════════════════════════════════════════════════════════════════
   PERIAPSES — orbital link station
   Everything you'd normally want to change lives in the CONFIG block
   inside the <script> tag at the bottom of this file. Look for the
   big "EDIT YOUR LINKS HERE" banner.
   ══════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #04070f;
  --deep:       #061225;
  --blue:       #2f7fd4;
  --blue-lt:    #7cc4ff;
  --blue-glow:  rgba(76, 163, 255, .55);
  --text:       #e8f2ff;
  --muted:      rgba(196, 219, 245, .62);
  --hair:       rgba(124, 196, 255, .22);
  --accent:     #4ca3ff;        /* overridden per-link at runtime */
  --font: "Space Grotesk", "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}

html { scroll-behavior: auto; background: var(--ink); }

body {
  font-family: var(--font);
  color: var(--text);
  background: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* The page is tall on purpose — its height is what you scroll through
   to advance the orbit. It's set from JS based on how many links exist. */
#scrollTrack { width: 1px; pointer-events: none; }

/* ─────────────────────────────  DEEP SPACE  ───────────────────────── */

.sky {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 78% 18%,  rgba(29, 92, 168, .30) 0%, transparent 55%),
    radial-gradient(100% 80% at 12% 82%,  rgba(20, 74, 140, .26) 0%, transparent 58%),
    radial-gradient(70%  70% at 50% 50%,  rgba(12, 45, 92,  .34) 0%, transparent 70%),
    linear-gradient(#04070f 0%, #061428 45%, #04080f 100%);
}

#stars { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the long sweeping light trails from the brand art */
.trails { position: absolute; inset: -12% -8%; width: 116%; height: 124%; opacity: .85; }
.trails path { fill: none; stroke-linecap: round; }

.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(76% 66% at 50% 48%, transparent 42%, rgba(2,5,12,.62) 82%, rgba(2,5,12,.9) 100%);
}

/* ─────────────────────────────  THE STAGE  ───────────────────────── */

.stage {
  position: fixed; inset: 0; z-index: 1;
  display: grid; place-items: center;
  perspective: 1450px;
  perspective-origin: 50% 46%;
  transition: perspective-origin .5s cubic-bezier(.22,1,.36,1);
}

.system { position: relative; width: 0; height: 0; }

/* ── the planet: the Periapses mark, rendered as vector ── */
.planet {
  position: absolute; left: 50%; top: 50%;
  width: var(--planet, 340px); height: var(--planet, 340px);
  margin: calc(var(--planet, 340px) / -2) 0 0 calc(var(--planet, 340px) / -2);
  z-index: 1000;
  animation: drift 15s ease-in-out infinite;
  filter: drop-shadow(0 0 78px rgba(48,124,214,.40)) drop-shadow(0 0 22px rgba(124,196,255,.20));
}
.planet svg { width: 100%; height: 100%; display: block; }

@keyframes drift {
  0%, 100% { transform: translate3d(0, -10px, 0); }
  50%      { transform: translate3d(0,  10px, 0); }
}

/* soft atmosphere bloom behind the disc */
.halo {
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--planet, 340px) * 2.1); height: calc(var(--planet, 340px) * 2.1);
  margin: calc(var(--planet, 340px) * -1.05) 0 0 calc(var(--planet, 340px) * -1.05);
  border-radius: 50%; z-index: 998; pointer-events: none;
  background: radial-gradient(circle, rgba(63,146,236,.20) 0%, rgba(45,110,190,.09) 38%, transparent 66%);
  animation: breathe 9s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }

/* ── the orbital track (tiny dots, placed once, never re-laid-out) ── */
.tick {
  position: absolute; left: 50%; top: 50%;
  width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
  border-radius: 50%; background: var(--blue-lt);
  pointer-events: none; will-change: transform;
}

/* ── satellites ── */
.sat {
  position: absolute; left: 50%; top: 50%;
  width: 0; height: 0;
  will-change: transform;
}

.pod {
  position: absolute; left: 50%; top: 50%;
  width: 128px; height: 128px; margin: -64px 0 0 -64px;
  display: grid; place-items: center;
  text-decoration: none; color: var(--text);
  border-radius: 26px;
  background:
    linear-gradient(155deg, rgba(18,44,80,.72), rgba(7,18,38,.78));
  border: 1px solid rgba(124,196,255,.28);
  box-shadow:
    0 0 0 1px rgba(4,10,22,.6),
    0 18px 44px rgba(2,8,20,.6),
    inset 0 1px 0 rgba(180,220,255,.14);
  transition: border-color .45s ease, box-shadow .45s ease, background .45s ease;
  -webkit-tap-highlight-color: transparent;
}

/* corner brackets — reads like a targeting reticle */
.pod::before, .pod::after {
  content: ""; position: absolute; width: 15px; height: 15px;
  border: 2px solid var(--accent); opacity: 0;
  transition: opacity .4s ease, inset .4s cubic-bezier(.22,1,.36,1);
}
.pod::before { top: 9px;    left: 9px;    border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
.pod::after  { bottom: 9px; right: 9px;   border-left: 0;  border-top: 0;    border-radius: 0 0 6px 0; }

.pod .glyph { width: 46%; height: 46%; display: block; color: var(--text); transition: color .4s ease, transform .5s cubic-bezier(.22,1,.36,1); }
.pod .glyph svg { width: 100%; height: 100%; display: block; }
.pod .glyph [stroke] { stroke: currentColor; }
.pod .glyph [fill]:not([fill="none"]) { fill: currentColor; }

.pod .tag {
  position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap; opacity: 0;
  transition: opacity .4s ease; font-family: var(--mono);
}

/* the satellite currently parked front-and-centre */
.sat.live .pod {
  border-color: color-mix(in srgb, var(--accent) 70%, transparent);
  background: linear-gradient(155deg,
      color-mix(in srgb, var(--accent) 22%, rgba(10,26,52,.8)),
      rgba(7,18,38,.85));
  box-shadow:
    0 0 0 1px rgba(4,10,22,.6),
    0 0 60px color-mix(in srgb, var(--accent) 40%, transparent),
    0 22px 60px rgba(2,8,20,.7),
    inset 0 1px 0 rgba(200,232,255,.2);
}
.sat.live .pod::before, .sat.live .pod::after { opacity: .95; }
.sat.live .pod .glyph { color: #fff; }
.sat.live .pod .tag { opacity: 1; }

.pod:hover  { border-color: var(--accent); }
.pod:hover .glyph { transform: scale(1.1); }
.sat.flag .pod { border-color: var(--accent); box-shadow: 0 0 50px color-mix(in srgb, var(--accent) 45%, transparent), 0 18px 44px rgba(2,8,20,.6); }

/* ─────────────────────────────  HUD  ───────────────────────── */

.hud { position: fixed; inset: 0; z-index: 40; pointer-events: none; }

/* wordmark, top centre */
.brand {
  position: absolute; top: clamp(26px, 5vh, 54px); left: 50%; transform: translateX(-50%);
  text-align: center; transition: opacity .6s ease, transform .6s ease;
}
.brand h1 {
  font-size: clamp(20px, 3.4vw, 34px); font-weight: 700;
  letter-spacing: .42em; text-indent: .42em;
  background: linear-gradient(180deg, #fff, #8dc4f5);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand p {
  margin-top: 12px; font-size: clamp(10px, 1.1vw, 12px);
  letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  font-family: var(--mono);
}
.scrolled .brand { opacity: .18; transform: translateX(-50%) translateY(-8px); }

/* readout, bottom centre — mirrors whichever link is in focus */
.readout {
  position: absolute; left: 50%; bottom: clamp(30px, 7vh, 68px);
  transform: translateX(-50%); text-align: center; width: min(90vw, 560px);
}
.readout .idx {
  font-family: var(--mono); font-size: 11px; letter-spacing: .3em;
  color: var(--accent); opacity: .9; margin-bottom: 12px;
}
.readout .name {
  font-size: clamp(24px, 4.6vw, 44px); font-weight: 700; letter-spacing: -.01em; line-height: 1.05;
}
.readout .handle {
  margin-top: 9px; font-family: var(--mono); font-size: clamp(11px, 1.4vw, 13px);
  letter-spacing: .1em; color: var(--muted);
}
.readout .go {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
  margin-top: 22px; padding: 12px 26px; border-radius: 999px;
  font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 600;
  text-decoration: none; color: var(--text); font-family: var(--mono);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  background: color-mix(in srgb, var(--accent) 12%, rgba(6,16,32,.66));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: background .3s ease, border-color .3s ease, transform .3s ease, box-shadow .3s ease;
}
.readout .go:hover {
  background: color-mix(in srgb, var(--accent) 26%, rgba(6,16,32,.7));
  border-color: var(--accent); transform: translateY(-2px);
  box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 30%, transparent);
}
.readout .go .arr { transition: transform .3s ease; }
.readout .go:hover .arr { transform: translateX(4px); }

/* swap animation when focus changes */
.readout .swap { animation: swapIn .55s cubic-bezier(.22,1,.36,1) both; }
@keyframes swapIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* scroll nudge */
.nudge {
  position: absolute; right: clamp(20px, 3vw, 44px); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--muted); transition: opacity .5s ease;
}
.nudge span { writing-mode: vertical-rl; }
.nudge i {
  display: block; width: 1px; height: 54px;
  background: linear-gradient(var(--blue-lt), transparent);
  animation: fall 2.1s ease-in-out infinite;
}
@keyframes fall { 0% { opacity: 0; transform: scaleY(.2); transform-origin: top; } 45% { opacity: 1; } 100% { opacity: 0; transform: scaleY(1); transform-origin: top; } }
.scrolled .nudge { opacity: 0; }

/* ─────────────────────────  NAV (hover)  ───────────────────────── */

.nav { position: fixed; top: clamp(20px, 3vh, 34px); left: clamp(20px, 3vw, 38px); z-index: 60; }

.knob {
  width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; position: relative;
  border: 1px solid rgba(124,196,255,.3);
  background: linear-gradient(150deg, rgba(16,40,74,.8), rgba(6,16,34,.85));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 26px rgba(2,8,20,.6), inset 0 1px 0 rgba(180,220,255,.14);
  transition: border-color .35s ease, box-shadow .35s ease;
}
.knob::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 1px solid rgba(124,196,255,.18); border-top-color: var(--blue-lt);
  animation: spin 6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.knob i { display: block; width: 17px; height: 1.5px; background: var(--text); border-radius: 2px; position: relative; transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .3s ease; }
.knob i::before, .knob i::after { content: ""; position: absolute; left: 0; width: 17px; height: 1.5px; background: var(--text); border-radius: 2px; transition: transform .4s cubic-bezier(.22,1,.36,1); }
.knob i::before { top: -6px; } .knob i::after { top: 6px; }

.nav:hover .knob, .nav:focus-within .knob { border-color: var(--blue-lt); box-shadow: 0 0 34px rgba(76,163,255,.4); }
.nav:hover .knob i, .nav:focus-within .knob i { transform: rotate(45deg); }
.nav:hover .knob i::before, .nav:focus-within .knob i::before { transform: translateY(6px) rotate(-90deg); }
.nav:hover .knob i::after,  .nav:focus-within .knob i::after  { transform: translateY(-6px) rotate(-90deg); }

/* invisible bridge so the pointer can travel from knob to panel */
.panel-wrap { position: absolute; top: 44px; left: -10px; padding-top: 22px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.nav:hover .panel-wrap, .nav:focus-within .panel-wrap { opacity: 1; pointer-events: auto; }

.panel {
  width: 320px; max-height: min(78vh, 720px); overflow-y: auto; overscroll-behavior: contain;
  border-radius: 22px; padding: 14px 12px 16px;
  border: 1px solid rgba(124,196,255,.24);
  background: linear-gradient(165deg, rgba(11,28,54,.93), rgba(5,13,28,.95));
  backdrop-filter: blur(22px) saturate(1.25); -webkit-backdrop-filter: blur(22px) saturate(1.25);
  box-shadow: 0 30px 70px rgba(1,5,14,.72), inset 0 1px 0 rgba(180,220,255,.12);
  transform: translateY(-10px) scale(.97); transform-origin: top left;
  transition: transform .42s cubic-bezier(.22,1,.36,1);
  scrollbar-width: thin; scrollbar-color: rgba(124,196,255,.3) transparent;
}
.nav:hover .panel, .nav:focus-within .panel { transform: none; }
.panel::-webkit-scrollbar { width: 5px; }
.panel::-webkit-scrollbar-thumb { background: rgba(124,196,255,.3); border-radius: 9px; }

.panel .cap {
  font-family: var(--mono); font-size: 9px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--muted); padding: 6px 14px 16px;
  display: flex; justify-content: space-between;
  border-bottom: 1px solid rgba(124,196,255,.13); margin-bottom: 8px;
}

/* rows: roomy, with a hairline between each so they read as a list */
.rows { display: flex; flex-direction: column; gap: 2px; }

.row {
  display: flex; align-items: center; gap: 15px;
  padding: 13px 14px; border-radius: 14px;
  text-decoration: none; color: var(--text);
  transition: background .22s ease, transform .22s ease;
  position: relative;
}
.row + .row::after {
  content: ""; position: absolute; top: -1px; left: 14px; right: 14px; height: 1px;
  background: rgba(124,196,255,.09);
}
.row:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); transform: translateX(4px); }
.row:hover::after, .row:hover + .row::after { opacity: 0; }
.row .ic { width: 21px; height: 21px; flex: none; color: var(--muted); transition: color .22s ease; }
.row .ic svg { width: 100%; height: 100%; display: block; }
.row .ic [stroke] { stroke: currentColor; } .row .ic [fill]:not([fill="none"]) { fill: currentColor; }
.row:hover .ic { color: var(--accent); }
.row .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row .t1 { font-size: 14px; font-weight: 600; letter-spacing: .01em; line-height: 1.15; }
.row .t2 { font-size: 10.5px; font-family: var(--mono); color: var(--muted); letter-spacing: .05em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─────────────────────────  RESPONSIVE  ───────────────────────── */

@media (max-width: 860px) {
  .pod { width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 21px; }
  .pod::before, .pod::after { width: 12px; height: 12px; }
  .nudge { display: none; }
  .panel-wrap { left: -8px; }
  .panel { width: min(78vw, 292px); }
  .readout { bottom: clamp(22px, 5vh, 44px); }
}

@media (max-width: 520px) {
  .pod { width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 18px; }
  .pod .tag { display: none; }
  .brand p { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .planet, .halo, .knob::after, .nudge i, .trails path { animation: none !important; }
  .readout .swap { animation: none !important; }
}

/* ══════════════════════════════════════════════════════════════════════

(function () {
  'use strict';

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  const N       = LINKS.length;
  const TWO_PI  = Math.PI * 2;
  const STEP    = TWO_PI / N;
  const RAD     = CONFIG.TILT * Math.PI / 180;
  const SIN_T   = Math.sin(RAD);
  const COS_T   = Math.cos(RAD);
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stage   = document.getElementById('stage');
  const system  = document.getElementById('system');
  const track   = document.getElementById('scrollTrack');
  const body    = document.body;

  let R = 560;                 // orbit radius, recalculated on resize
  let sats = [];               // { el, pod, data, phase }
  let ticks = [];
  let pos = 0;                 // smoothed orbital position
  let scrollTarget = 0;        // where the scrollbar says we should be
  let hoverTarget = null;      // nav preview override
  let live = -1;               // index currently in focus
  let maxScroll = 1;

  /* ── swap in a custom planet image if one was configured ── */
  if (CONFIG.PLANET_IMAGE) {
    const p = document.getElementById('planet');
    p.innerHTML = '<img src="' + CONFIG.PLANET_IMAGE + '" alt="Periapses" ' +
                  'style="width:100%;height:100%;display:block;border-radius:50%;object-fit:cover">';
  }

  /* ── build satellites ── */
  function buildSatellites() {
    const frag = document.createDocumentFragment();
    LINKS.forEach(function (link, i) {
      const sat = document.createElement('div');
      sat.className = 'sat';

      const pod = document.createElement('a');
      pod.className = 'pod';
      pod.href = link.url;
      pod.target = '_blank';
      pod.rel = 'noopener noreferrer';
      pod.setAttribute('aria-label', link.name + ' — ' + (link.handle || ''));
      pod.style.setProperty('--accent', link.color || '#4ca3ff');
      pod.innerHTML =
        '<span class="glyph">' + (ICONS[link.icon] || ICONS.link) + '</span>' +
        '<span class="tag">' + escapeHtml(link.name) + '</span>';

      sat.appendChild(pod);
      frag.appendChild(sat);
      sats.push({ el: sat, pod: pod, data: link, phase: Math.random() * TWO_PI });
    });
    system.appendChild(frag);
  }

  /* ── build the faint dotted orbit path (placed once) ── */
  function buildTrack() {
    const frag = document.createDocumentFragment();
    const COUNT = 132;
    for (let i = 0; i < COUNT; i++) {
      const d = document.createElement('div');
      d.className = 'tick';
      frag.appendChild(d);
      ticks.push({ el: d, t: (i / COUNT) * TWO_PI });
    }
    system.appendChild(frag);
  }

  function layoutTrack() {
    ticks.forEach(function (tk) {
      const p = place(tk.t);
      tk.el.style.transform =
        'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,' + p.z.toFixed(1) + 'px)';
      tk.el.style.opacity = (0.05 + p.depth * 0.30).toFixed(3);
      tk.el.style.zIndex  = Math.round(1000 + p.z);
    });
  }

  /* ── the orbit itself ──
     theta = 0 puts a satellite front-and-centre, closest to the camera.
     Increasing theta walks it leftward across the front of the planet,
     out of frame, around the back, and in again from the right.        */
  function place(theta) {
    const px = -R * Math.sin(theta);
    const pz =  R * Math.cos(theta);
    return {
      x: px,
      y: pz * SIN_T,
      z: pz * COS_T,
      depth: (pz + R) / (2 * R)      // 0 = far side, 1 = nearest
    };
  }

  /* ── scroll → orbital position, with a dwell so links park and float ── */
  function ease(v) {
    const i = Math.floor(v);
    const f = v - i;
    const d = Math.min(0.45, Math.max(0, CONFIG.DWELL));
    let t = (f - d) / (1 - 2 * d);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return i + t * t * (3 - 2 * t);
  }

    maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    let y = window.scrollY || window.pageYOffset;

    if (CONFIG.LOOP) {
      // one full page of scroll == one full revolution, so the top and the
      // bottom describe the identical scene. Jumping between them is invisible.
      if (y >= maxScroll - 1)      { window.scrollTo(0, 1);             y = 1; }
      else if (y <= 0)             { window.scrollTo(0, maxScroll - 1); y = maxScroll - 1; }
    }

  function nearest(index, from) {
    let best = index, bestD = Infinity;
    for (let k = -2; k <= 2; k++) {
      const cand = index + k * N;
      const d = Math.abs(cand - from);
      if (d < bestD) { bestD = d; best = cand; }
    }
    return best;
  }

  /* ── main loop ── */
  function frame(now) {
    const t = now * 0.001;
    const aim = hoverTarget !== null ? nearest(hoverTarget, pos) : scrollTarget;

    pos += (aim - pos) * (REDUCED ? 1 : CONFIG.GLIDE);

    let bestIdx = 0, bestAbs = Infinity;

    for (let i = 0; i < N; i++) {
      const s = sats[i];
      let th = (pos - i) * STEP;
      th = ((th % TWO_PI) + TWO_PI + Math.PI) % TWO_PI - Math.PI;   // wrap to −π..π

      const p = place(th);
      const bob = REDUCED ? 0 : Math.sin(t * 0.7 + s.phase) * 9 * (0.35 + p.depth * 0.65);
      const sway = REDUCED ? 0 : Math.cos(t * 0.5 + s.phase) * 5;

      s.el.style.transform =
        'translate3d(' + (p.x + sway).toFixed(1) + 'px,' +
                         (p.y + bob).toFixed(1)  + 'px,' +
                          p.z.toFixed(1)         + 'px)';
      s.el.style.zIndex = Math.round(1000 + p.z);

      // far side: shrink away, dim, and defocus
      const far = 1 - p.depth;
      s.pod.style.opacity = (0.12 + p.depth * 0.88).toFixed(3);
      s.pod.style.filter  = far > 0.55 ? 'blur(' + ((far - 0.55) * 7).toFixed(1) + 'px)' : 'none';
      s.pod.style.pointerEvents = p.depth > 0.45 ? 'auto' : 'none';

      const a = Math.abs(th);
      if (a < bestAbs) { bestAbs = a; bestIdx = i; }
    }

    if (bestIdx !== live) { live = bestIdx; setFocus(bestIdx); }

    requestAnimationFrame(frame);
  }

  /* ── the bottom readout follows whichever link is parked out front ── */
  const rIdx = document.getElementById('rIdx');
  const rName = document.getElementById('rName');
  const rHandle = document.getElementById('rHandle');
  const rGo = document.getElementById('rGo');

  function setFocus(i) {
    const link = LINKS[i];
    sats.forEach(function (s, k) { s.el.classList.toggle('live', k === i); });

    document.documentElement.style.setProperty('--accent', link.color || '#4ca3ff');
    rIdx.textContent = pad(i + 1) + ' / ' + pad(N);
    rName.textContent = link.name;
    rHandle.textContent = link.handle || '';
    rGo.href = link.url;

    [rName, rHandle].forEach(function (el) {
      el.classList.remove('swap');
      void el.offsetWidth;               // restart the animation
      el.classList.add('swap');
    });
  }

  /* ── nav panel ── */
  function buildNav() {
    const rows = document.getElementById('navRows');
    document.getElementById('navCount').textContent = pad(N);

    LINKS.forEach(function (link, i) {
      const a = document.createElement('a');
      a.className = 'row';
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.setProperty('--accent', link.color || '#4ca3ff');
      a.innerHTML =
        '<span class="ic">' + (ICONS[link.icon] || ICONS.link) + '</span>' +
        '<span class="txt"><span class="t1">' + escapeHtml(link.name) + '</span>' +
        '<span class="t2">' + escapeHtml(link.handle || '') + '</span></span>';

      // hovering a row flies the orbit to that link as a live preview
      a.addEventListener('mouseenter', function () {
        hoverTarget = i;
        sats[i].el.classList.add('flag');
      });
      a.addEventListener('mouseleave', function () {
        hoverTarget = null;
        sats[i].el.classList.remove('flag');
      });
      rows.appendChild(a);
    });
  }

  /* ── starfield: three parallax layers, gentle twinkle ── */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [], dpr = 1, cw = 0, ch = 0;
  let mx = 0, my = 0, tmx = 0, tmy = 0;

  function seedStars() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth; ch = window.innerHeight;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.round((cw * ch) / 5200);
    stars = [];
    for (let i = 0; i < count; i++) {
      const layer = i % 3;
      stars.push({
        x: Math.random() * cw,
        y: Math.random() * ch,
        r: (layer === 2 ? 1.5 : layer === 1 ? 1.05 : 0.65) * (0.6 + Math.random() * 0.7),
        a: 0.2 + Math.random() * 0.6,
        sp: 0.4 + Math.random() * 1.4,
        ph: Math.random() * TWO_PI,
        px: (layer + 1) * 7
      });
    }
  }

  function paintStars(t) {
    ctx.clearRect(0, 0, cw, ch);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = REDUCED ? 1 : 0.62 + Math.sin(t * s.sp + s.ph) * 0.38;
      const x = s.x + mx * s.px;
      const y = s.y + my * s.px;
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = s.r > 1.2 ? '#cfe6ff' : '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, TWO_PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function starLoop(now) {
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;
    paintStars(now * 0.001);
    requestAnimationFrame(starLoop);
  }

  /* ── pointer parallax on the whole scene ── */
  function onPointer(e) {
    const nx = (e.clientX / window.innerWidth  - 0.5);
    const ny = (e.clientY / window.innerHeight - 0.5);
    tmx = -nx * 2; tmy = -ny * 2;
    stage.style.perspectiveOrigin = (50 + nx * 6).toFixed(1) + '% ' + (46 + ny * 5).toFixed(1) + '%';
  }

  /* ── sizing ── */
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    R = Math.max(240, Math.min(620, vw * 0.40, vh * 0.78));
    const planet = Math.max(190, Math.min(420, Math.min(vw, vh) * 0.42));
    document.documentElement.style.setProperty('--planet', planet + 'px');
    track.style.height = ((N + 1) * 100) + 'vh';
    seedStars();
    layoutTrack();
    readScroll();
  }

  /* ── keyboard: arrows / page keys nudge one slot at a time ── */
  function onKey(e) {
    const seg = maxScroll / N;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault(); window.scrollBy({ top: seg, behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault(); window.scrollBy({ top: -seg, behavior: 'smooth' });
    } else if (e.key === 'Enter' && document.activeElement === document.body) {
      window.open(LINKS[live].url, '_blank', 'noopener');
    }
  }

  /* ── helpers ── */
  function pad(n) { return String(n).padStart(2, '0'); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── go ── */
  buildSatellites();
  buildTrack();
  buildNav();
  resize();
  setFocus(0);
  live = 0;
  pos = scrollTarget;

  window.addEventListener('scroll', readScroll, { passive: true });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
  window.addEventListener('pointermove', onPointer, { passive: true });

  requestAnimationFrame(frame);
  requestAnimationFrame(starLoop);
})();
</script>
</body>
</html>
